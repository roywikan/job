name: Build atscvresume static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install and build
        working-directory: atscvresume
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: "/atscvresume"
          NEXT_PUBLIC_SITE_URL: "https://job.web.id"
        run: |
          echo "dangerouslyAllowAllBuilds=true" >> .npmrc
          pnpm install --frozen-lockfile
          pnpm run build:cloudflare
          test -d out

      - name: Publish to public/atscvresume
        run: |
          rm -rf public/atscvresume
          mkdir -p public/atscvresume
          cp -R atscvresume/out/. public/atscvresume/
          find public/atscvresume -name "index.html" | head -10

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/atscvresume
          git diff --staged --quiet || git commit -m "chore: build public/atscvresume for job.web.id"
          git push
